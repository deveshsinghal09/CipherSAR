services:
  - type: web
    name: ciphersar-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build -w @ciphersar/shared && npm run build -w @ciphersar/api
    startCommand: npm run start -w @ciphersar/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
